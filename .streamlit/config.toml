[client]
# Sin el botón de CSV de las tablas: la descarga es con el botón de Excel
disableDataExport = true

[theme]
baseRadius = "6px"
showWidgetBorder = true

[theme.light]
primaryColor = "#2a78d6"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
chartSequentialColors = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#3987e5", "#256abf", "#1c5cab", "#184f95", "#0d366b"]

[theme.dark]
primaryColor = "#3987e5"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
chartSequentialColors = ["#0d366b", "#184f95", "#1c5cab", "#256abf", "#3987e5", "#6da7ec", "#86b6ef", "#9ec5f4", "#b7d3f6", "#cde2fb"]